{% extends "base.html" %}
{% block title %}{{ code }} · Odoo PM Agent{% endblock %}
{% block main_class %}min-h-full flex items-center justify-center px-6 py-24{% endblock %}
{% block content %}
<div class="text-center">
  <p class="font-mono text-5xl font-semibold text-accent">{{ code }}</p>
  <p class="mt-3 text-sm text-slate-600">{{ message }}</p>
  <a href="/dashboard" class="mt-6 inline-block text-sm text-accent hover:underline">Back to dashboard</a>
</div>
{% endblock %}
