[project]
name = "odoo-qa-gate"
version = "0.1.0"
description = "Automated verification gate between 'the developer says it is done' and 'a human looks at it', run in place on a client's managed Odoo staging instance."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
]

[project.scripts]
qa-gate = "qa_gate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qa_gate*"]

[tool.setuptools.package-data]
qa_gate = ["migrations/*.sql", "web/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
